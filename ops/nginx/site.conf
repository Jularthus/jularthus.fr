# The site's own nginx, inside the container (non-root, port 8080).
# Host nginx terminates TLS and proxies here (ops/nginx/jularthus.fr.conf),
# so everything that belongs to the site lives in this file: headers,
# 404 page, cache, compression. `make up` locally behaves like production.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # behind the proxy: keep redirects relative to the public host
    absolute_redirect off;

    # Compression happens here: host nginx keeps gzip_proxied off on purpose
    # (compressing proxied app responses over TLS opens BREACH-style leaks).
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/css application/javascript image/svg+xml application/json text/plain application/xml;

    # Security headers. Every location below inherits them, as long as it
    # does not use add_header itself (nginx would drop these otherwise).
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Unknown URLs get the styled page; the status stays 404.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # For the container healthcheck (compose.yml).
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Never serve hidden files or backups; /.well-known/ (security.txt) is the exception.
    location ~ /\.(?!well-known/) {
        return 404;
    }
    location ~ \.(swp|swo|bak|orig|old)$ {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # CSS/JS carry a ?v=<content hash> in the pages (tools/stamp-assets.py).
    location /assets/ {
        expires 7d;
        try_files $uri =404;
    }
}
