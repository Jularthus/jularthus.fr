server {
    listen 80;
    server_name jularthus.fr;
    return 301 https://$host$request_uri;
}


server {
    listen 443 ssl;
    server_name jularthus.fr;

    ssl_certificate     /etc/letsencrypt/live/jularthus.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jularthus.fr/privkey.pem;

    root /var/www/jularthus.fr/public;
    index index.html;

    # Security headers. Every location below inherits them, as long as it
    # does not use add_header itself (nginx would drop these otherwise).
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Never serve hidden files (.git, .env, editor swap files...) or backups.
    location ~ /\.(?!well-known/) {
        return 404;
    }
    location ~ \.(swp|swo|bak|orig|old)$ {
        return 404;
    }

    location / {
        set $svc_name "Jularthus";
        include /etc/nginx/snippets/offline.conf;
        try_files $uri $uri/ =404;
    }

    # CSS/JS carry a ?v= version in index.html; bump it when they change.
    location /assets/ {
        expires 7d;
        try_files $uri =404;
    }

    # Phishing-awareness exercise: anything under /files/ (game.exe, a/b/c,
    # missing or not) shows the page from /var/www/maintenance, URL unchanged.
    # ^~ also wins over the regex locations above, so /files/x.bak lands here.
    # The page loads Google Fonts and one inline script, so it gets its own
    # CSP, and with it the full header set (add_header here drops the
    # server's). The sha256 is the inline script's: recompute it if the
    # script changes, or the e-mail line stays empty.
    location ^~ /files/ {
        # Discord's crawler gets a 404 so the link shows no preview: the
        # page title would give the exercise away. Only the bot is affected.
        if ($http_user_agent ~* "Discordbot") {
            return 404;
        }
        root /var/www/maintenance;
        try_files /_phishing_prevention.html =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'sha256-2/imt+WA68Uy6aMTdIHS02TtHmOpLKOyLZJBU5arj+k='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    }

    # Live counter for the "1 million d'amis" card: same-origin proxy to the
    # beer tracker's public API, so the page needs no CORS and no extra CSP.
    location = /live/beers {
        proxy_pass http://127.0.0.1:8337/api/dashboard;
        proxy_set_header Host beers.jularthus.fr;
        proxy_hide_header X-Content-Type-Options;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        expires 1m;
    }
}
